[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routekernel"
version = "1.0.0"
description = "An experimental runtime for Mixture-of-Experts inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
gpu = ["triton>=3.1; sys_platform == 'linux'"]
amd = ["wgpu>=0.31,<0.33"]

[project.scripts]
routekernel = "routekernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["routekernel*"]

[tool.setuptools.package-data]
routekernel = ["shaders/*.wgsl"]
